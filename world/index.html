<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>World Editor</h1>
    <canvas id="myCanvas"></canvas>

    <div id="controls">
        <button onclick="dispose()">Dispose</button>
        <button onclick="save()">Save</button>
        <button id="graphBtn" onclick="setMode('graph')">Roads</button>
        <button id="stopBtn" onclick="setMode('stop')">Stop sign</button>
        <button id="crossingBtn" onclick="setMode('crossing')">Crossing</button>
        <button id="lightBtn" onclick="setMode('light')">Light</button>
    </div>

    <script src="js/math/utils.js"></script>
    <script src="js/primitives/point.js"></script>
    <script src="js/primitives/segment.js"></script>
    <script src="js/primitives/polygon.js"></script>
    <script src="js/primitives/envelope.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/items/tree.js"></script>
    <script src="js/markings/marking.js"></script>
    <script src="js/markings/stop.js"></script>
    <script src="js/markings/crossing.js"></script>
    <script src="js/markings/light.js"></script>
    <script src="js/world.js"></script>
    <script src="js/viewport.js"></script>
    <script src="js/graphEditor.js"></script>
    <script src="js/markingEditor.js"></script>
    <script src="js/stopEditor.js"></script>
    <script src="js/crossingEditor.js"></script>
    <script src="js/lightEditor.js"></script>
    <script src="main.js"></script>
</body>

</html>
